
[tool.black]
line-length = 80

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc"
dynamic = ["version"]
dependencies = [
	"scipy",
	"torch",
	"matplotlib",
	"einops",
	"lightning",
	"ipykernel",
	"pytest",
	"pytest-xdist",
	"hydra-core",
	"tensordict",
	"ruff",
	"pre-commit>=2.21.0",
]
readme = "README.md"
requires-python = ">=3.7"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pre-commit"]

[tool.setuptools]
# tell setuptools where to find packages
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E402", "E501", "E731"]

[tool.uv]
prompt = 'mcmc'
